name: Android

on:
  workflow_dispatch:
  push:
    branches: ["codex/eink-studio-poc"]
    tags: ["eink-studio-poc-*", "inky-sketch-*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Test and build proof of concept
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Name installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/inky-sketch.apk
      - uses: actions/upload-artifact@v5
        with:
          name: inky-sketch
          path: app/build/outputs/apk/debug/inky-sketch.apk
          if-no-files-found: error
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/eink-studio-poc-') || startsWith(github.ref, 'refs/tags/inky-sketch-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "app/build/outputs/apk/debug/inky-sketch.apk"
          --prerelease
          --title "Inky Sketch ${GITHUB_REF_NAME#inky-sketch-}"
          --notes "Standalone, offline BOOX-native drawing POC with pressure-aware pen, pencil, and marker brushes; a pixel/segment eraser; layers; undo/redo; v1 canvas migration; and atomic local autosave. No permissions required."
