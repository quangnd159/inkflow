name: Android companion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build BOOX proof of concept
        run: gradle -p android-companion assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: inkflow-boox-lab
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
