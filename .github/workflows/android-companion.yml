name: Android companion

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "companion-*"
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build BOOX companion
        run: gradle -p android-companion assembleDebug --stacktrace
      - name: Name installable APK
        run: cp android-companion/app/build/outputs/apk/debug/app-debug.apk android-companion/app/build/outputs/apk/debug/inkflow-boox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: inkflow-boox
          path: android-companion/app/build/outputs/apk/debug/inkflow-boox.apk
          if-no-files-found: error
      - name: Publish tagged companion build
        if: startsWith(github.ref, 'refs/tags/companion-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "android-companion/app/build/outputs/apk/debug/inkflow-boox.apk"
          --prerelease
          --title "Inkflow BOOX ${GITHUB_REF_NAME#companion-}"
          --notes "End-to-end Inkflow companion test for BOOX. Open it from the Inkflow ribbon inside Obsidian, choose the vault root once, and write through Onyx's native raw-pen path. This prerelease persists editable ink and PNG snapshots directly to the selected vault without network or broad storage permissions."
