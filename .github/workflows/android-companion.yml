name: Android companion

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "companion-poc-*"
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build BOOX proof of concept
        run: gradle -p android-companion assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: inkflow-boox-lab
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish tagged feasibility build
        if: startsWith(github.ref, 'refs/tags/companion-poc-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "android-companion/app/build/outputs/apk/debug/app-debug.apk#inkflow-boox-lab-0.1.0.apk"
          --prerelease
          --title "Inkflow BOOX Lab 0.1.0"
          --notes "Native BOOX raw-ink feasibility build for the Go 10.3. This is not the production Inkflow companion and does not retain notes yet. Install it only to compare stylus latency with FreeMark. The status must read 'Raw ink ready' before testing."
